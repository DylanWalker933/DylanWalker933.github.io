<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="一个采用苹果官网风格的简洁问候页面。">
  <title>嗨嗨嗨，来了奥</title>
  <style>
    :root {
      --apple-black: #1d1d1f;
      --apple-gray: #6e6e73;
      --apple-light: #f5f5f7;
      --apple-blue: #0066cc;
      --apple-border: rgba(0, 0, 0, 0.08);
      --shadow-soft: 0 24px 80px rgba(0, 0, 0, 0.08);
      color-scheme: light;
    }

    * { box-sizing: border-box; }

    html, body { margin: 0; min-height: 100%; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Helvetica Neue", Arial, "PingFang SC", "Microsoft YaHei", sans-serif;
      color: var(--apple-black);
      background: #fff;
      -webkit-font-smoothing: antialiased;
    }

    a { color: inherit; text-decoration: none; }

    .nav {
      position: sticky;
      top: 0;
      z-index: 10;
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 52px;
      padding: 0 max(24px, calc((100% - 1080px) / 2));
      background: rgba(255, 255, 255, 0.82);
      backdrop-filter: saturate(180%) blur(20px);
      border-bottom: 1px solid var(--apple-border);
    }

    .brand {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      font-size: 17px;
      font-weight: 600;
      letter-spacing: -0.01em;
    }

    .mark {
      width: 22px;
      height: 22px;
      border-radius: 50%;
      background: radial-gradient(circle at 30% 25%, #ffffff 0 12%, #8e8e93 13% 34%, #1d1d1f 35% 100%);
      box-shadow: 0 0 0 1px rgba(0, 0, 0, 0.08);
    }

    .nav-links {
      display: flex;
      align-items: center;
      gap: 28px;
      color: #424245;
      font-size: 13px;
    }

    .nav-links span { cursor: default; }

    .hero {
      position: relative;
      display: grid;
      min-height: calc(100vh - 52px);
      place-items: center;
      overflow: hidden;
      background:
        radial-gradient(circle at 10% 0%, rgba(0, 102, 204, 0.10), transparent 32%),
        radial-gradient(circle at 90% 12%, rgba(134, 179, 227, 0.18), transparent 28%),
        linear-gradient(180deg, #ffffff 0%, #f5f5f7 100%);
    }

    .hero::after {
      content: "";
      position: absolute;
      inset: auto 0 -18% 0;
      height: 55%;
      background: linear-gradient(90deg, rgba(0, 102, 204, 0.10), rgba(88, 86, 214, 0.10), rgba(255, 55, 95, 0.08));
      filter: blur(70px);
      transform: translateZ(0);
    }

    .message {
      position: relative;
      z-index: 1;
      width: min(780px, calc(100% - 48px));
      padding: 72px 24px 90px;
      text-align: center;
    }

    .eyebrow {
      margin: 0 0 20px;
      color: var(--apple-blue);
      font-size: 15px;
      font-weight: 600;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      color: var(--apple-black);
      font-size: clamp(42px, 9vw, 96px);
      line-height: 1.05;
      letter-spacing: -0.045em;
    }

    .subtle {
      margin: 24px auto 0;
      max-width: 520px;
      color: var(--apple-gray);
      font-size: clamp(18px, 3vw, 24px);
      line-height: 1.45;
      letter-spacing: -0.015em;
    }

    .cta {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin-top: 38px;
      padding: 14px 28px;
      border: 0;
      border-radius: 980px;
      background: var(--apple-blue);
      color: #fff;
      font-size: 17px;
      font-weight: 500;
      cursor: pointer;
      transition: transform 180ms ease, background 180ms ease, box-shadow 180ms ease;
    }

    .cta:hover {
      background: #0071e3;
      box-shadow: 0 16px 36px rgba(0, 102, 204, 0.22);
      transform: translateY(-1px);
    }

    .cta:active { transform: translateY(0); }

    .glass-panel {
      position: relative;
      z-index: 1;
      margin: -58px auto 0;
      width: min(760px, calc(100% - 40px));
      padding: 28px;
      border: 1px solid rgba(255, 255, 255, 0.65);
      border-radius: 28px;
      background: rgba(255, 255, 255, 0.72);
      box-shadow: var(--shadow-soft);
      backdrop-filter: blur(24px) saturate(160%);
      text-align: center;
    }

    .glass-title {
      margin: 0 0 8px;
      color: #1d1d1f;
      font-size: 19px;
      font-weight: 600;
      letter-spacing: -0.01em;
    }

    .glass-copy {
      margin: 0;
      color: var(--apple-gray);
      font-size: 15px;
      line-height: 1.6;
    }

    footer {
      padding: 48px max(24px, calc((100% - 1080px) / 2)) 40px;
      background: #fff;
      color: var(--apple-gray);
      font-size: 12px;
      line-height: 1.7;
      text-align: center;
    }

    @media (max-width: 700px) {
      .nav { height: auto; min-height: 48px; padding-top: 10px; padding-bottom: 10px; }
      .nav-links { display: none; }
      .message { padding-top: 56px; padding-bottom: 84px; }
      .glass-panel { margin-top: -42px; }
    }

    @media (prefers-reduced-motion: no-preference) {
      .message { animation: rise 900ms cubic-bezier(0.25, 1, 0.35, 1) both; }
      @keyframes rise {
        from { opacity: 0; transform: translateY(22px); }
        to { opacity: 1; transform: translateY(0); }
      }
    }
  </style>
</head>
<body>
  <header class="nav">
    <a class="brand" href="/" aria-label="网站首页">
      <span class="mark" aria-hidden="true"></span>
      <span>欢迎</span>
    </a>
    <nav class="nav-links" aria-label="主导航">
      <span>首页</span>
      <span>问候</span>
      <span>风格</span>
      <span>联系</span>
    </nav>
  </header>

  <main>
    <section class="hero" aria-labelledby="greeting">
      <div class="message">
        <p class="eyebrow">Welcome</p>
        <h1 id="greeting">嗨嗨嗨，来了奥</h1>
        <p class="subtle">简洁、清爽、留白。像 Apple 官网一样，把注意力留给最重要的一句话。</p>
        <button class="cta" type="button" onclick="this.textContent='很高兴见到你'">了解更多</button>
      </div>
    </section>

    <section class="glass-panel" aria-label="页面说明">
      <h2 class="glass-title">为 GitHub Pages 打造</h2>
      <p class="glass-copy">这个页面是纯静态网页，无需服务器，也无需数据库，可直接部署到 GitHub Pages。</p>
    </section>
  </main>

  <footer>
    © 2026 · Designed with an Apple-inspired color system.
  </footer>
</body>
</html>
